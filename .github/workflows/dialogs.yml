name: dialogs

# The options dialog in the MuseScore desktop app, opened and pressed the way a user would (test/gui/). Linux gets a
# virtual display. GitHub's Windows and macOS runners have a desktop session of their own, which test/gui/drivers/
# drives through user32 and System Events.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  dialog:
    name: dialog (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux, os: ubuntu-latest }
          - { platform: windows, os: windows-latest }
          - { platform: macos, os: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # The dialog tests share the extension tests' harness, which loads istanbul.
      - name: Install the coverage tools
        run: npm ci --ignore-scripts
      - id: musescore
        uses: $/.github/actions/install-musescore
      - name: Dialog tests
        env:
          MSCORE: ${{ steps.musescore.outputs.mscore }}
          MUSESCORE_APP: ${{ steps.musescore.outputs.app }}
          HBUC_SCREENSHOTS: ${{ runner.temp }}/screenshots
        run: |
          mkdir -p "$HBUC_SCREENSHOTS"
          npm run test:gui
      # SPIKE, removed before merge: MuseScore's own log, where the platform does not pass it to standard output.
      - name: MuseScore's log
        if: failure() && runner.os != 'Linux'
        run: |
          for d in "${LOCALAPPDATA:-/nonexistent}/MuseScore/MuseScore4/logs" "$HOME/Library/Application Support/MuseScore/MuseScore4/logs"; do
            [ -d "$d" ] && ls -la "$d" && tail -n 60 "$d"/"$(ls "$d" | sort | tail -n 1)"
          done
          ls -la "$HOME/Library/Preferences" 2>/dev/null | grep -i muse || true
          ls -la "${APPDATA:-/nonexistent}/MuseScore" 2>/dev/null || true
          true
      - name: Keep the screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dialog-${{ matrix.platform }}-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
