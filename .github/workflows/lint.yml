name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # to upload the SARIF results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks reads the whole history
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # No dependency's install script runs in a job that can write to code scanning.
      - name: Install ESLint
        run: npm ci --ignore-scripts
      # The "# renovate:" comments tell Renovate where each version comes from (see renovate.json).
      - name: Install zizmor
        run: |
          # renovate: datasource=pypi depName=zizmor
          pipx install zizmor==1.31.1
      # It checks the PowerShell the Windows dialog tests drive MuseScore with.
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          # renovate: datasource=nuget depName=PSScriptAnalyzer registryUrl=https://www.powershellgallery.com/api/v2/
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
      # VERSION is the release's tag. Renovate changes it and SHA256 together, taking the hash from the release's
      # checksums file.
      - name: Install gitleaks
        env:
          VERSION: v8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/bin" gitleaks
          rm gitleaks.tar.gz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # With GH_TOKEN set, zizmor also runs its online audits.
      - name: Lint and scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/lint.js --strict --sarif sarif
      # A pull request from a fork gets a token that cannot write to code scanning.
      - name: Upload zizmor results
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sarif/zizmor.sarif
          category: zizmor
      - name: Upload gitleaks results
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sarif/gitleaks.sarif
          category: gitleaks
      - name: Upload PSScriptAnalyzer results
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sarif/pssa.sarif
          category: psscriptanalyzer
