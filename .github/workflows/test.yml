name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # Pure JavaScript, on every platform: the command-line tool reads and writes paths and archives, and those can
  # behave differently on Windows.
  fast:
    name: fast (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux, os: ubuntu-latest }
          - { platform: windows, os: windows-latest }
          - { platform: macos, os: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Install the coverage tools
        run: npm ci --ignore-scripts
      - name: Unit and end-to-end tests
        run: npm run test:fast:coverage
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: fast-${{ matrix.platform }}
          files: coverage/fast/lcov.info
          disable_search: true
          fail_ci_if_error: true
      # Codecov's per-component checks need its Pro plan, so the job holds what it measured to 80% itself.
      - name: Coverage floor
        run: node tools/coverage-gate.js fast coverage/fast/lcov.info --exclude handbells-used-chart/bundle.js

  # The extension inside a real MuseScore, counted by an instrumented copy (test/extension/coverage.js).
  extension:
    name: extension (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux, os: ubuntu-latest }
          - { platform: windows, os: windows-latest }
          - { platform: macos, os: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Install the coverage tools
        run: npm ci --ignore-scripts
      - id: musescore
        uses: $/.github/actions/install-musescore
      - name: Extension tests
        env:
          MSCORE: ${{ steps.musescore.outputs.mscore }}
          HBUC_COVERAGE_DIR: ${{ runner.temp }}/coverage-raw
        run: npm run test:extension
      - name: Merge coverage
        run: npm run coverage:extension -- "$RUNNER_TEMP/coverage-raw" coverage/extension
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: extension-${{ matrix.platform }}
          files: coverage/extension/lcov.info
          disable_search: true
          fail_ci_if_error: true
      # lib/ is held by the fast job and form.js only loads in the dialog, through bundle.js, so this floor is the
      # scripts MuseScore runs directly.
      - name: Coverage floor
        run: >-
          node tools/coverage-gate.js extension coverage/extension/lcov.info
          --include "handbells-used-chart/*.js"
          --exclude handbells-used-chart/bundle.js
          --exclude handbells-used-chart/form.js
